<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whatsapp-pairing-frontend</title>

    <!-- Prevent flash of unthemed content by applying the saved theme synchronously. -->
    <style>html{visibility:hidden}html[data-theme]{visibility:visible}</style>
    <script>
      (function(){
        try {
          var key = '26tech-theme';
          var saved = null;
          if (typeof window !== 'undefined' && window.localStorage) {
            saved = window.localStorage.getItem(key);
          }
          var theme = saved === 'warmStone' || saved === 'slateIndigo' ? saved : 'slateIndigo';
          document.documentElement.setAttribute('data-theme', theme);
          // Reveal the document once the theme attribute is in place.
          document.documentElement.style.visibility = 'visible';
        } catch (e) {
          // If anything goes wrong, reveal the page to avoid blocking the app.
          try { document.documentElement.style.visibility = 'visible'; } catch (__) {}
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
